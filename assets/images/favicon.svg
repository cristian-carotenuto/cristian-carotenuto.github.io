<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- P4 TV World Icon: Retro Yellow TV with Antennas and Glasses -->
  <defs>
    <linearGradient id="p4Yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF033"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
  </defs>
  <!-- TV Antenna -->
  <line x1="18" y1="4" x2="28" y2="18" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
  <circle cx="17" cy="3" r="2.5" fill="#FFCC00" stroke="#161616" stroke-width="1.5"/>
  <line x1="46" y1="4" x2="36" y2="18" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
  <circle cx="47" cy="3" r="2.5" fill="#FFCC00" stroke="#161616" stroke-width="1.5"/>
  
  <!-- Outer TV Body (Black/Dark) -->
  <rect x="6" y="16" width="52" height="42" rx="7" fill="#161616" stroke="#FFCC00" stroke-width="2"/>
  
  <!-- CRT Screen (P4 Yellow) -->
  <rect x="11" y="21" width="36" height="32" rx="4" fill="url(#p4Yellow)" stroke="#161616" stroke-width="2"/>
  
  <!-- Persona 4 TV Glasses inside screen -->
  <rect x="15" y="30" width="11" height="8" rx="2" fill="#161616"/>
  <rect x="29" y="30" width="11" height="8" rx="2" fill="#161616"/>
  <line x1="26" y1="33" x2="29" y2="33" stroke="#161616" stroke-width="2"/>
  <rect x="17" y="32" width="7" height="4" rx="1" fill="#FFCC00"/>
  <rect x="31" y="32" width="7" height="4" rx="1" fill="#FFCC00"/>

  <!-- TV Knobs & Dials -->
  <circle cx="51.5" cy="27" r="3" fill="#FFCC00" stroke="#161616" stroke-width="1"/>
  <circle cx="51.5" cy="36" r="3" fill="#FFCC00" stroke="#161616" stroke-width="1"/>
  <line x1="49" y1="45" x2="54" y2="45" stroke="#FFCC00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="48" x2="54" y2="48" stroke="#FFCC00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="51" x2="54" y2="51" stroke="#FFCC00" stroke-width="1.5" stroke-linecap="round"/>
</svg>
